<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#03060f; --card:#0a1120; --line:#12254d; --accent:#22c7f0; --text:#eaf2ff; --muted:#7f95bd; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; min-height:100vh; }
  header { position:sticky; top:0; z-index:5; background:rgba(3,6,15,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; padding:12px 20px; }
  header h1 { font-family:Syne,sans-serif; font-size:1.2rem; white-space:nowrap; }
  #q { flex:1; max-width:520px; margin:0 auto; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:10px 18px; font:inherit; }
  #q:focus { outline:none; border-color:var(--accent); }
  .btn { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.main { background:var(--accent); color:#02101a; border-color:var(--accent); font-weight:500; }
  main { padding:24px 20px 60px; max-width:1400px; margin:0 auto; }

  .panel { display:none; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:24px; }
  .panel.show { display:block; }
  .panel h2 { font-family:Syne,sans-serif; font-size:1.05rem; margin-bottom:6px; }
  .panel .hint { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .row input[type=text] { flex:1 1 200px; background:#050a16; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  .row label { color:var(--muted); display:flex; gap:6px; align-items:center; }
  #pmsg { margin-top:10px; color:var(--muted); font-size:.9rem; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer; transition:border-color .2s, transform .2s; }
  .card:hover, .card:focus-visible { border-color:var(--accent); transform:translateY(-4px); outline:none; }
  .thumb { position:relative; aspect-ratio:16/9; background:linear-gradient(135deg,#0a2a8c 0%,#061a52 50%,#020b2b 100%); display:grid; place-items:center; overflow:hidden; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .badge { position:relative; width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); display:grid; place-items:center; font-size:24px; }
  .info { padding:16px 20px 20px; }
  .info h3 { font-family:Syne,sans-serif; font-weight:800; font-size:1.05rem; line-height:1.25; }
  .info p { color:var(--muted); font-size:.92rem; margin-top:5px; }
  .quitar { margin-top:10px; font-size:.8rem; padding:4px 10px; display:none; }
  body.editando .quitar { display:inline-block; }
  .vacio { color:var(--muted); padding:30px 0; }

  #watch { display:none; }
  #watch.show { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:28px; }
  #home.hide { display:none; }
  .frame { width:100%; aspect-ratio:16/9; border:0; border-radius:16px; background:#000; display:block; }
  .msg { aspect-ratio:16/9; border:1px solid var(--line); border-radius:16px; background:var(--card); display:grid; place-items:center; text-align:center; color:var(--muted); padding:24px; }
  #wtitle { font-family:Syne,sans-serif; font-size:1.4rem; margin:16px 0 4px; }
  .sub { color:var(--muted); }
  .sub a { color:var(--accent); }
  #back { margin-bottom:16px; }
  #side h3 { font-family:Syne,sans-serif; font-size:1rem; margin-bottom:12px; }
  .item { display:flex; gap:12px; margin-bottom:14px; cursor:pointer; border-radius:12px; padding:6px; border:1px solid transparent; }
  .item:hover { border-color:var(--line); background:var(--card); }
  .item .thumb { width:150px; flex:none; border-radius:10px; }
  .item .badge { width:34px; height:34px; font-size:14px; }
  .item h4 { font-size:.95rem; font-weight:500; line-height:1.3; }
  .item p { color:var(--muted); font-size:.85rem; margin-top:4px; }
  @media (max-width:900px) {
    #watch.show { grid-template-columns:1fr; }
    header h1 { display:none; }
  }
  .bar { height:8px; background:#050a16; border-radius:8px; margin-top:14px; overflow:hidden; display:none; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .footer { display:flex; justify-content:flex-end; margin-top:40px; }
  .nota { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .lockbtn { margin-top:10px; font-size:.8rem; padding:4px 10px; }
</style>
</head>
<body>

<header>
  <h1>Clases</h1>
  <input id="q" type="search" placeholder="Buscar clases…">
</header>

<main>
  <div class="panel" id="panel">
    <h2>Subir una clase nueva</h2>
    <p class="hint">Solo tú ves este panel. El video se guarda en tu carpeta de Drive y aparece para todos.</p>
    <div class="row">
      <input type="text" id="ptitulo" placeholder="Título de la clase">
      <input type="file" id="parchivo" accept="video/*" style="color:var(--muted);max-width:100%">
      <label><input type="checkbox" id="pbloq" checked> Subir bloqueada</label>
      <button class="btn main" id="pok">Subir video</button>
    </div>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <p id="pmsg"></p>
  </div>

  <p class="nota" id="nota"></p>

  <section id="home">
    <div class="grid" id="grid"></div>
    <p class="vacio" id="vacio" hidden>No se encontraron clases.</p>
    <div class="footer"><button class="btn" id="admin">Acceso profesor</button></div>
  </section>

  <section id="watch">
    <div>
      <button class="btn" id="back">← Todas las clases</button>
      <div id="player"></div>
      <h2 id="wtitle"></h2>
      <p class="sub" id="wsub"></p>
    </div>
    <aside id="side"><h3>Más clases</h3><div id="list"></div></aside>
  </section>
</main>

<script>
  // =====================================================
  //  1) Pega aquí la URL de tu Apps Script (termina en /exec)
  //  Mientras no la pongas, se muestran las clases de ejemplo de BASE.
  // =====================================================
  const API = "https://script.google.com/macros/s/AKfycbxSyX9kdV0QF7oIuBAJk4jdSbm-7bOXDoNzJ8JkYaJfxz0EC80rBV7Szd0idy_7L_wk/exec";

  const BASE = [
    { titulo: "Introducción a los índices sintéticos", link: "https://drive.google.com/file/d/1hcZESbscxM8VJou1umkBVKk8eXv1usQn/view?usp=drive_link", locked: false },
    { titulo: "Velas japonesas y tendencias", link: "", locked: true },
    { titulo: "Boom y Crash en la práctica",  link: "", locked: true },
    { titulo: "Psicotrading",                 link: "", locked: true }
  ];

  const $ = id => document.getElementById(id);
  let clases = [];
  let clave = "";   // solo en memoria; el servidor es quien verifica la clave

  function idDeDrive(link) {
    if (!link) return "";
    const m = link.match(/\/d\/([\w-]+)/) || link.match(/[?&]id=([\w-]+)/);
    return m ? m[1] : "";
  }
  const deBase = () => BASE.map(b => ({ titulo: b.titulo, id: idDeDrive(b.link), locked: b.locked }));
  const hayAPI = () => API.indexOf("http") === 0;

  async function post(body) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify({ password: clave, ...body }) });
    return r.json();
  }

  async function cargar() {
    if (!hayAPI()) {
      clases = deBase();
      $("nota").textContent = "Mostrando clases de ejemplo. Falta conectar con Drive (URL de Apps Script).";
    } else {
      try {
        const r = clave ? await post({ action: "adminList" }) : await (await fetch(API)).json();
        if (r.error) throw new Error(r.error);
        clases = r.map(x => ({ titulo: x.title, id: x.id, locked: x.locked }));
        $("nota").textContent = "";
      } catch (e) {
        clases = deBase();
        $("nota").textContent = "No se pudo conectar con Drive; mostrando clases de ejemplo.";
      }
    }
    dibujar();
  }

  function miniatura(c) {
    const t = document.createElement("div");
    t.className = "thumb";
    const puedeVer = c.id && (!c.locked || clave);
    if (puedeVer) {
      const img = document.createElement("img");
      img.alt = ""; img.loading = "lazy";
      img.src = `https://drive.google.com/thumbnail?id=${c.id}&sz=w640`;
      img.onerror = () => img.remove();
      t.appendChild(img);
    }
    const b = document.createElement("div");
    b.className = "badge";
    b.textContent = c.locked ? "🔒" : "▶";
    t.appendChild(b);
    return t;
  }

  function dibujar() {
    const q = $("q").value.trim().toLowerCase();
    const grid = $("grid");
    grid.innerHTML = "";
    const lista = clases.map((c, i) => ({ c, i })).filter(x => !q || x.c.titulo.toLowerCase().includes(q));
    $("vacio").hidden = lista.length > 0;
    lista.forEach(({ c, i }) => {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.appendChild(miniatura(c));
      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = "<h3></h3><p></p>";
      info.querySelector("h3").textContent = c.titulo;
      info.querySelector("p").textContent = "Clase " + (i + 1);
      if (clave) {
        const b = document.createElement("button");
        b.className = "btn lockbtn";
        b.textContent = c.locked ? "Desbloquear" : "Bloquear";
        b.onclick = async e => {
          e.stopPropagation();
          await post({ action: "lock", id: c.id, locked: !c.locked });
          cargar();
        };
        info.appendChild(b);
      }
      card.appendChild(info);
      card.onclick = () => ver(i);
      card.onkeydown = e => { if (e.key === "Enter") ver(i); };
      grid.appendChild(card);
    });
  }

  function ver(i) {
    const c = clases[i];
    $("home").classList.add("hide");
    $("watch").classList.add("show");
    $("wtitle").textContent = c.titulo;
    const p = $("player");
    $("wsub").textContent = "Clase " + (i + 1);
    if (c.locked && !clave) {
      p.innerHTML = '<div class="msg">Esta clase está bloqueada por ahora.</div>';
    } else if (!c.id) {
      p.innerHTML = '<div class="msg">Esta clase aún no tiene video.</div>';
    } else {
      p.innerHTML = `<iframe class="frame" src="https://drive.google.com/file/d/${c.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      $("wsub").innerHTML = `Clase ${i + 1} · ¿No carga en tu teléfono? <a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${c.id}/view">Ábrelo en Drive</a>`;
    }
    const list = $("list");
    list.innerHTML = "";
    clases.forEach((o, j) => {
      if (j === i) return;
      const it = document.createElement("div");
      it.className = "item";
      it.appendChild(miniatura(o));
      const d = document.createElement("div");
      d.innerHTML = "<h4></h4><p></p>";
      d.querySelector("h4").textContent = o.titulo;
      d.querySelector("p").textContent = "Clase " + (j + 1);
      it.appendChild(d);
      it.onclick = () => ver(j);
      list.appendChild(it);
    });
    window.scrollTo(0, 0);
  }

  function inicio() {
    $("player").innerHTML = "";
    $("watch").classList.remove("show");
    $("home").classList.remove("hide");
  }
  $("back").onclick = inicio;
  $("q").oninput = () => { inicio(); dibujar(); };

  // ---------- Acceso profesor (la clave la verifica el servidor) ----------
  $("admin").onclick = async () => {
    if (!hayAPI()) { alert("Primero conecta la página con tu Apps Script (variable API)."); return; }
    const k = prompt("Clave de profesor:");
    if (!k) return;
    clave = k;
    try {
      const r = await post({ action: "adminList" });
      if (r.error) { clave = ""; alert(r.error); return; }
    } catch (e) { clave = ""; alert("No se pudo conectar con el script."); return; }
    $("panel").classList.add("show");
    $("admin").style.display = "none";
    cargar();
  };

  $("pok").onclick = async () => {
    const file = $("parchivo").files[0];
    const titulo = $("ptitulo").value.trim();
    const msg = $("pmsg");
    if (!titulo || !file) { msg.textContent = "Escribe el título y elige un video."; return; }
    $("pok").disabled = true;
    msg.textContent = "Preparando la subida…";
    const ext = (file.name.split(".").pop() || "mp4").toLowerCase();
    const name = `${Date.now()}.${ext}`;
    const s = await post({ action: "session", name, type: file.type || "video/mp4", origin: location.origin });
    if (s.error) { msg.textContent = "Error: " + s.error; $("pok").disabled = false; return; }
    $("bar").style.display = "block";
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", s.url);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    let avance = 0;
    xhr.upload.onprogress = e => {
      avance = e.loaded / e.total;
      $("fill").style.width = Math.round(avance * 100) + "%";
      msg.textContent = `Subiendo… ${Math.round(avance * 100)}%`;
    };
    const terminar = async () => {
      msg.textContent = "Guardando en la carpeta…";
      const f = await post({ action: "finish", name, title: titulo, locked: $("pbloq").checked });
      $("pok").disabled = false;
      if (f.error) { msg.textContent = "Error: " + f.error; return; }
      msg.textContent = "¡Clase subida!";
      $("ptitulo").value = ""; $("parchivo").value = "";
      $("bar").style.display = "none"; $("fill").style.width = "0";
      cargar();
    };
    xhr.onload = terminar;
    xhr.onerror = () => {
      if (avance > 0.99) terminar();
      else { msg.textContent = "Se cortó la subida. Intenta de nuevo."; $("pok").disabled = false; }
    };
    xhr.send(file);
  };

  cargar();
</script>
</body>
</html>
